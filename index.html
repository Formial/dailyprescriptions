<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formial Labs — Prescription Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',Arial,sans-serif;background:#e8f4fb;color:#1a1a1a;min-height:100vh}
  .header{background:#054660;padding:0 24px;height:60px;display:flex;align-items:center;gap:14px;border-bottom:2px solid #BFE6FF}
  .header img{height:32px}
  .header-text{color:#BFE6FF;font-size:14px;font-weight:600;letter-spacing:.04em}
  .header-sub{color:rgba(191,230,255,.65);font-size:11px;font-weight:400}
  .container{max-width:900px;margin:32px auto;padding:0 20px}
  .card{background:#fff;border-radius:10px;border:1.5px solid #BFE6FF;overflow:hidden;margin-bottom:24px}
  .card-header{background:#054660;padding:14px 20px;color:#fff;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
  .card-body{padding:20px}
  label{display:block;font-size:12px;font-weight:600;color:#054660;margin-bottom:5px;margin-top:14px;text-transform:uppercase;letter-spacing:.05em}
  label:first-child{margin-top:0}
  input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid #BFE6FF;border-radius:6px;font-family:'Inter',Arial,sans-serif;font-size:13px;color:#1a1a1a;background:#f0f7fc;outline:none;transition:border .15s}
  input:focus,textarea:focus{border-color:#054660;background:#fff}
  textarea{resize:vertical;min-height:60px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .btn-add{background:#054660;color:#fff;border:none;border-radius:6px;padding:11px 28px;font-size:13px;font-weight:600;cursor:pointer;margin-top:20px;transition:opacity .15s}
  .btn-add:hover{opacity:.85}
  .btn-pdf{background:#054660;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-pdf:hover{opacity:.85}
  .btn-del{background:transparent;border:1.5px solid #e05;color:#e05;border-radius:6px;padding:6px 12px;font-size:11px;cursor:pointer;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#f0f7fc;color:#054660;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #BFE6FF;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  td{padding:10px 12px;border-bottom:1px solid #e8f4fb;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f0f7fc}
  .badge{display:inline-block;background:#e8f4fb;color:#054660;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
  .empty-state{text-align:center;padding:40px 20px;color:#5a8a9f;font-size:13px}
  .paste-area{background:#f0f7fc;border:1.5px dashed #BFE6FF;border-radius:8px;padding:16px;margin-bottom:16px}
  .paste-area textarea{background:#fff;min-height:100px;font-family:monospace;font-size:12px}
  .paste-btn{background:#BFE6FF;color:#054660;border:none;border-radius:6px;padding:9px 20px;font-size:12px;font-weight:700;cursor:pointer;margin-top:10px}
  .paste-hint{font-size:11px;color:#5a8a9f;margin-top:6px}
  .section-divider{display:flex;align-items:center;gap:10px;margin:10px 0 16px;color:#5a8a9f;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:#BFE6FF}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#e8f4fb;border:1.5px solid #BFE6FF;border-radius:20px;padding:4px 10px;font-size:12px;color:#054660;font-weight:500}
  .chip-name{font-weight:600}
  .chip-ctrl{display:inline-flex;align-items:center;gap:2px}
  .chip-btn{background:#054660;color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-weight:700}
  .chip-btn:hover{background:#0a6a9a}
  .chip-val{min-width:36px;text-align:center;font-weight:700;font-size:12px;color:#054660}
  select{width:100%;padding:9px 12px;border:1.5px solid #BFE6FF;border-radius:6px;font-family:'Inter',Arial,sans-serif;font-size:13px;color:#1a1a1a;background:#f0f7fc;outline:none}
</style>
</head>

<div class="container">

  <div class="card">
    <div class="card-header">Bulk Import (Paste Rows)</div>
    <div class="card-body">
      <div class="paste-area">
        <textarea id="pasteInput" placeholder="Paste your pipe-separated rows here, one per line&#10;e.g. Rishabh S, 30Y|||Tretinoin 0.015% + Niacinamide 4%||||||Use 1-2 pumps at night||||||Date of compounding: 08-06-2026|||Expiry date: 13-07-2026||||||Formial labs pharmacist:"></textarea>
        <button class="paste-btn" onclick="parsePaste()">⬆ Import Rows</button>
        <div class="paste-hint">Format: Name, Age ||| Formula ||| Instructions ||| Date of compounding: DD-MM-YYYY ||| Expiry date: DD-MM-YYYY ||| Pharmacist name</div>
      </div>

      <div class="section-divider">or add manually</div>

      <div class="row2">
        <div>
          <label>Patient Name</label>
          <input id="f_name" type="text" placeholder="e.g. Rishabh S">
        </div>
        <div>
          <label>Age</label>
          <input id="f_age" type="text" placeholder="e.g. 30Y">
        </div>
      </div>

      <label>Formula Template</label>
      <select id="f_template" onchange="applyTemplate()">
        <option value="">— Select a formula —</option>
        <option value="Tretinoin 0.025% + Spironolactone 5% + Clindamycin 1%">Tretinoin + Spironolactone 5% + Clindamycin 1%</option>
        <option value="Tretinoin 0.025% + Niacinamide 4% + Azelaic Acid 4%">Tretinoin + Niacinamide 4% + Azelaic Acid 4%</option>
        <option value="Tretinoin 0.025% + Azelaic Acid 4% + Kojic Acid 2% + Tranexamic Acid 5%">Tretinoin + Azelaic Acid 4% + Kojic Acid 2% + Tranexamic Acid 5%</option>
        <option value="Tretinoin 0.025% + Hydroquinone 4% + Kojic Acid 2%">Tretinoin + Hydroquinone 4% + Kojic Acid 2%</option>
        <option value="Hyaluronic Acid 1% + Niacinamide 4% + Azelaic Acid 10%">Hyaluronic Acid 1% + Niacinamide 4% + Azelaic Acid 10%</option>
        <option value="Tretinoin 0.025% + Niacinamide 4% + Hyaluronic Acid 1%">Tretinoin + Niacinamide 4% + Hyaluronic Acid 1%</option>
        <option value="Spironolactone 5% Foam">Spironolactone 5% Foam</option>
        <option value="Minoxidil 5% Foam">Minoxidil 5% Foam</option>

let prescriptions = [];

function parsePaste() {
  const raw = document.getElementById('pasteInput').value.trim();
  if (!raw) return;
  const lines = raw.split('\n').filter(l => l.trim());
  let added = 0;
  lines.forEach(line => {
    const parts = line.split(/\|{2,}/).map(s => s.trim());
    if (parts.length < 2) return;
    const nameParts = parts[0].split(',');
    const name = nameParts[0].trim();
    const age  = nameParts[1] ? nameParts[1].trim() : '';
    const formula      = parts[1] || '';
    const instructions = parts[2] || 'Use 1-2 pumps at night as directed';
    let compound_date = '', expiry = '';
    for (let i = 3; i < parts.length; i++) {
      const p = parts[i];
      if (/date of compounding/i.test(p))  compound_date = p.replace(/date of compounding:/i,'').trim();
      else if (/expiry date/i.test(p))      expiry        = p.replace(/expiry date:/i,'').trim();
    }
    prescriptions.push({ name, age, formula, instructions, compound_date, expiry, id: Date.now()+Math.random() });
    added++;
  });
  document.getElementById('pasteInput').value = '';
  renderTable();
  if (added) alert(added + ' prescription(s) imported.');
}

// ── DATE HELPERS ──
function fmtDate(d) {
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return dd+'-'+mm+'-'+yyyy;
}
function initDates() {
  const today = new Date();
  const expiry = new Date(today); expiry.setDate(expiry.getDate()+35);
  document.getElementById('f_compound_date').value = fmtDate(today);
  document.getElementById('f_expiry').value = fmtDate(expiry);
}

// ── CHIP / CONCENTRATION EDITOR ──
let chipIngredients = [];

function parseIngredients(formulaStr) {
  // Split on ' + ' and extract name + concentration
  return formulaStr.split(/\s*\+\s*/).map(part => {
    const m = part.match(/^(.*?)\s*([\d.]+)%(.*)$/);
    if (m) return { name: m[1].trim(), conc: parseFloat(m[2]), suffix: m[3].trim() };
    return { name: part.trim(), conc: null, suffix: '' };
  });
}

function ingredientsToFormula(arr) {
  return arr.map(i => i.conc !== null ? i.name+' '+i.conc+'%'+(i.suffix?' '+i.suffix:'') : i.name).join(' + ');
}

function renderChips() {
  const bar = document.getElementById('chip-bar');
  if (!chipIngredients.length) { bar.innerHTML=''; return; }
  bar.innerHTML = chipIngredients.map((ing, idx) => {
    if (ing.conc === null) {
      return `<span class="chip"><span class="chip-name">${ing.name}</span></span>`;
    }
    return `<span class="chip">
      <span class="chip-name">${ing.name}</span>
      <span class="chip-ctrl">
        <button class="chip-btn" onclick="adjConc(${idx},-0.005)">−</button>
        <span class="chip-val">${ing.conc.toFixed(3).replace(/\.?0+$/,'')}%</span>
        <button class="chip-btn" onclick="adjConc(${idx},+0.005)">+</button>
      </span>
    </span>`;
  }).join('');
}

function adjConc(idx, delta) {
  let v = Math.round((chipIngredients[idx].conc + delta) * 1000) / 1000;
  if (v < 0.001) v = 0.001;
  chipIngredients[idx].conc = v;
  const formula = ingredientsToFormula(chipIngredients);
  document.getElementById('f_formula').value = formula;
  renderChips();
}

function applyTemplate() {
  const val = document.getElementById('f_template').value;
  if (!val) return;
  document.getElementById('f_formula').value = val;
  chipIngredients = parseIngredients(val);
  renderChips();
}

// sync chips when user types manually
document.addEventListener('DOMContentLoaded', () => {
  initDates();
  document.getElementById('f_formula').addEventListener('input', function() {
    chipIngredients = parseIngredients(this.value);
    renderChips();
  });
});

function addRow() {
  const name          = document.getElementById('f_name').value.trim();
  const age           = document.getElementById('f_age').value.trim();
  const formula       = document.getElementById('f_formula').value.trim();
  const instructions  = document.getElementById('f_instructions').value.trim();
  const compound_date = document.getElementById('f_compound_date').value.trim();
  const expiry        = document.getElementById('f_expiry').value.trim();
  if (!name || !formula) { alert('Patient name and formula are required.'); return; }
  prescriptions.push({ name, age, formula, instructions, compound_date, expiry, id: Date.now() });
  document.getElementById('f_name').value = '';
  document.getElementById('f_age').value = '';
  document.getElementById('f_formula').value = '';
  document.getElementById('f_template').value = '';
  document.getElementById('chip-bar').innerHTML = '';
  chipIngredients = [];
  renderTable();
}

function deleteRow(id) {
  prescriptions = prescriptions.filter(p => p.id !== id);
  renderTable();
}

function renderTable() {
  const wrap = document.getElementById('tableWrap');
  if (!prescriptions.length) {
    wrap.innerHTML = '<div class="empty-state">No prescriptions yet.</div>';
    return;
  }
  let html = '<table><thead><tr><th>#</th><th>Patient</th><th>Formula</th><th>Compounded</th><th>Expiry</th><th></th></tr></thead><tbody>';
  prescriptions.forEach((p,i) => {
    html += `<tr>
      <td><span class="badge">${i+1}</span></td>
      <td><strong>${p.name}</strong>${p.age?' <span style="color:#5a8a9f;font-size:11px">'+p.age+'</span>':''}</td>
      <td style="max-width:220px;font-size:12px">${p.formula}</td>
      <td style="font-size:12px">${p.compound_date||'—'}</td>
      <td style="font-size:12px">${p.expiry||'—'}</td>
      <td style="white-space:nowrap;display:flex;gap:8px;align-items:center">
        <button class="btn-pdf" onclick="generatePDF(${p.id})">⬇ PDF</button>
        <button class="btn-del" onclick="deleteRow(${p.id})">✕</button>
      </td>
    </tr>`;
  });
  html += '</tbody></table>';
  html += `<div style="padding:14px 20px;border-top:1.5px solid #BFE6FF;display:flex;justify-content:flex-end">
    <button class="btn-pdf" style="padding:10px 24px;font-size:13px" onclick="downloadAll()">⬇ Download All PDFs</button>
  </div>`;
  wrap.innerHTML = html;
}

function generatePDF(id) { buildPDF(prescriptions.find(x => x.id === id)); }
function downloadAll()   { prescriptions.forEach((p,i) => setTimeout(()=>buildPDF(p), i*400)); }

function buildPDF(p) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const W = 210, H = 297;

  // ── HEADER BAR ──
  doc.setFillColor(5,70,96);
  doc.rect(0, 0, W, 32, 'F');
  doc.setFillColor(191,230,255);
  doc.rect(0, 31.5, W, 1.5, 'F');

  // LEFT: logo image only, then address below
